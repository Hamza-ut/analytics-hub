{% extends "base.html" %}

{% block content %}

<div class="mb-4">

    <h1>
        Upload File
    </h1>

    <p class="text-muted">
        Upload your datasets for use in projects and pipelines.
    </p>

</div>

{% if error %}
<div class="alert alert-danger">
    <strong>{{ error }}</strong>
</div>
{% endif %}

<div class="card">

    <div class="card-body">

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Select File
                </label>

                <input type="file"
                    name="file"
                    class="form-control-file"
                    required>

                <small class="form-text text-muted">
                    Supported formats depend on pipeline requirements.
                </small>

            </div>

            <button type="submit"
                class="btn btn-primary">

                Upload File

            </button>

        </form>

    </div>

</div>

{% endblock %}
